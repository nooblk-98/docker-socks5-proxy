name: Deploy to Server

run-name: Deploy ${{ github.sha }} to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the server at the same time; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/docker-socks5-proxy
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Prefer a pinned host key; fall back to scanning on first setup.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret not set; trusting host key from ssh-keyscan"
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            User ${SSH_USER:-ubuntu}
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync repository on server
        run: |
          ssh deploy "bash -s -- '$DEPLOY_DIR' '$REPO_URL' '$GITHUB_SHA'" <<'EOF'
          set -euo pipefail
          DEPLOY_DIR="$1"; REPO_URL="$2"; SHA="$3"

          command -v git >/dev/null || { echo "git is not installed on the server"; exit 1; }
          command -v docker >/dev/null || { echo "docker is not installed on the server"; exit 1; }

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            # Non-root deploy users (e.g. ubuntu) can't create dirs under /opt directly.
            if [ ! -d "$DEPLOY_DIR" ] && [ "$(id -u)" -ne 0 ]; then
              sudo -n mkdir -p "$DEPLOY_DIR"
              sudo -n chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
            fi
            git clone "$REPO_URL" "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git fetch --prune origin
          # .env is gitignored, so a hard reset leaves it untouched.
          git reset --hard "$SHA"
          echo "Checked out $(git log -1 --oneline)"
          EOF

      # Credentials come from repository secrets; everything else from repository
      # variables. Unset values are omitted so docker-compose.yml defaults apply.
      - name: Generate and upload .env
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_USERS: ${{ secrets.PROXY_USERS }}
          UPSTREAM_PROXY: ${{ secrets.UPSTREAM_PROXY }}
          SOCKS5_PORT: ${{ vars.SOCKS5_PORT }}
          ALLOWED_CIDR: ${{ vars.ALLOWED_CIDR }}
          ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
          BLOCKED_DESTINATIONS: ${{ vars.BLOCKED_DESTINATIONS }}
          BLOCKED_DOMAINS: ${{ vars.BLOCKED_DOMAINS }}
          UDP_ENABLED: ${{ vars.UDP_ENABLED }}
          IPV6_ENABLED: ${{ vars.IPV6_ENABLED }}
          DNS_SERVER: ${{ vars.DNS_SERVER }}
          TIMEOUT_CONNECT: ${{ vars.TIMEOUT_CONNECT }}
          TIMEOUT_NEGOTIATE: ${{ vars.TIMEOUT_NEGOTIATE }}
          TIMEOUT_IO: ${{ vars.TIMEOUT_IO }}
          TOR_ENABLED: ${{ vars.TOR_ENABLED }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          DRAIN_TIMEOUT: ${{ vars.DRAIN_TIMEOUT }}
          ALLOW_OPEN_PROXY: ${{ vars.ALLOW_OPEN_PROXY }}
        run: |
          if [ -z "$PROXY_USERS" ] && { [ -z "$PROXY_USER" ] || [ -z "$PROXY_PASS" ]; }; then
            if [ "$ALLOW_OPEN_PROXY" != "true" ]; then
              echo "::error::No credentials configured. Set the PROXY_USER + PROXY_PASS (or PROXY_USERS) secrets, or set the ALLOW_OPEN_PROXY variable to 'true' to run without auth."
              exit 1
            fi
            echo "::warning::Deploying WITHOUT authentication (ALLOW_OPEN_PROXY=true)"
          fi

          umask 077
          : > env.deploy
          for key in SOCKS5_PORT PROXY_USER PROXY_PASS PROXY_USERS UPSTREAM_PROXY \
                     ALLOWED_CIDR ALLOWED_DOMAINS BLOCKED_DESTINATIONS BLOCKED_DOMAINS \
                     UDP_ENABLED IPV6_ENABLED DNS_SERVER TIMEOUT_CONNECT TIMEOUT_NEGOTIATE \
                     TIMEOUT_IO TOR_ENABLED LOG_LEVEL DRAIN_TIMEOUT; do
            val="${!key}"
            [ -z "$val" ] && continue
            # Single quotes keep compose from interpolating '$' in passwords,
            # but compose has no escape for a quote inside them.
            case "$val" in
              *"'"*|*$'\n'*)
                echo "::error::$key contains a single quote or newline, which .env cannot represent"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$key" "$val" >> env.deploy
            echo "Set $key"
          done

          ssh deploy "umask 077 && cat > '$DEPLOY_DIR/.env'" < env.deploy
          rm -f env.deploy

      - name: Build and restart container
        run: |
          ssh deploy "bash -s -- '$DEPLOY_DIR'" <<'EOF'
          set -euo pipefail
          cd "$1"

          docker compose -f docker-compose.yml up -d --build --remove-orphans
          docker image prune -f

          # Give the container a moment, then make sure it is still running.
          sleep 5
          docker compose -f docker-compose.yml ps
          if [ -z "$(docker compose -f docker-compose.yml ps --status running -q socks5)" ]; then
            echo "::error::socks5 container is not running after deploy"
            docker compose -f docker-compose.yml logs --tail 100 socks5
            exit 1
          fi
          EOF

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA::7}\`"
            echo "**Path:** \`${DEPLOY_DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
